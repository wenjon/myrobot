<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>机器人头部对话 Demo · 数字人小柚</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft YaHei", system-ui, sans-serif; background: #0b0e17; color: #e6e6e6; height: 100vh; display: flex; }
  #left { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #face { width: 100%; height: 100%; display: block; }
  #wrap { flex: 1; position: relative; width: 100%; }
  #right { width: 380px; max-width: 42vw; display: flex; flex-direction: column; border-left: 1px solid #1c2233; padding: 16px; gap: 12px; }
  h1 { font-size: 16px; margin: 0 0 4px; font-weight: 600; }
  .sub { font-size: 12px; color: #7a8296; }
  #log { flex: 1; overflow-y: auto; background: #10141f; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 8px 10px; border-radius: 8px; font-size: 14px; line-height: 1.5; max-width: 90%; }
  .msg.user { align-self: flex-end; background: #2a3350; }
  .msg.bot { align-self: flex-start; background: #1a2030; }
  .row { display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; height: 56px; background: #10141f; border: 1px solid #1c2233; color: #e6e6e6; border-radius: 8px; padding: 8px; font-family: inherit; font-size: 14px; }
  button { background: #3a4a7a; color: #fff; border: none; border-radius: 8px; padding: 0 14px; cursor: pointer; font-size: 14px; }
  button:hover { background: #4a5c96; }
  button:disabled { opacity: 0.4; cursor: default; }
  #interrupt { background: #7a3a3a; }
  #mic { background: #3a7a5a; }
  #mic.on { background: #2fa06a; box-shadow: 0 0 0 2px rgba(47,160,106,.35); }
  .voice-hint { font-size: 12px; color: #7a8296; min-height: 16px; line-height: 1.4; }
  #status.ok { color: #6fcf97; }
  #status.bad { color: #eb5757; }
  .expr-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .expr-row button { background: #253048; padding: 4px 10px; font-size: 12px; }
  .expr-row select { background: #253048; color: #dfe6f5; border: 1px solid #3a4763;
                     border-radius: 4px; padding: 4px 6px; font-size: 12px; max-width: 100%; }
  /* 画像冲突确认卡（docs § 16.8）：用暖色边框区分于普通对话气泡 */
  #profileCards { display: flex; flex-direction: column; gap: 8px; }
  .profile-card { background: #1f1c14; border: 1px solid #6b5a2a; border-radius: 8px; padding: 10px; font-size: 13px; }
  .profile-card.pc-pending { opacity: 0.55; }
  .pc-title { font-weight: 600; color: #e0c56a; margin-bottom: 6px; }
  .pc-diff { margin-bottom: 6px; line-height: 1.6; }
  .pc-old { color: #8a8f9c; text-decoration: line-through; }
  .pc-arrow { color: #7a8296; }
  .pc-new { color: #6fcf97; font-weight: 600; }
  .pc-quote { color: #7a8296; font-size: 12px; margin-bottom: 8px; line-height: 1.5; }
  .pc-actions { display: flex; gap: 8px; }
  .pc-actions button { padding: 4px 12px; font-size: 12px; }
  .pc-yes { background: #3a6a4a; }
  .pc-no { background: #4a4a55; }

  /* ---- 视觉浮层（左下角）：相机实时画面 + 识别 + 深度/方位 ---- */
  #visionPanel {
    position: absolute; left: 12px; bottom: 12px; width: 232px;
    background: rgba(14,18,28,.86); border: 1px solid #26304a; border-radius: 10px;
    font-size: 12px; color: #cfd6e6; overflow: hidden; z-index: 10;
    backdrop-filter: blur(4px); box-shadow: 0 6px 22px rgba(0,0,0,.45);
  }
  #visionPanel.collapsed { width: auto; }
  #visionPanel.collapsed .vp-body { display: none; }
  .vp-head { display: flex; align-items: center; gap: 6px; padding: 7px 9px; cursor: pointer;
             background: rgba(37,48,72,.65); user-select: none; }
  .vp-title { flex: 1; font-weight: 600; color: #9fb0d0; }
  .vp-dot { width: 7px; height: 7px; border-radius: 50%; background: #6b7280; flex: none; }
  .vp-dot.live { background: #2fa06a; box-shadow: 0 0 6px #2fa06a; }
  .vp-dot.err { background: #eb5757; }
  .vp-dot.warn { background: #e0c56a; }
  .vp-toggle { color: #7a8296; font-size: 11px; }
  .vp-body { padding: 8px 9px 9px; }
  .vp-video { width: 100%; border-radius: 6px; background: #0a0d16; display: block;
              aspect-ratio: 4 / 3; object-fit: cover; }
  .vp-meta { margin-top: 6px; color: #7a8296; font-size: 11px; line-height: 1.5; }
  .vp-objs { margin-top: 6px; max-height: 132px; overflow-y: auto;
             display: flex; flex-direction: column; gap: 4px; }
  .vp-obj { display: flex; align-items: baseline; gap: 6px; padding: 3px 5px;
            background: #171d2c; border-radius: 5px; line-height: 1.4; }
  .vp-obj-id { color: #6b7a99; font-size: 10px; flex: none; }
  .vp-obj-type { color: #dfe6f5; font-weight: 600; flex: 1;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vp-obj-dist { color: #6fcf97; flex: none; }
  .vp-obj-dist.unknown { color: #6b7a99; }
  .vp-obj-dir { color: #9fb0d0; flex: none; font-size: 11px; }
  .vp-empty { color: #5d6678; padding: 3px 2px; }
  /* 画面占满时（窄屏）浮层缩得更小，避免挡住数字人 */
  @media (max-width: 760px) { #visionPanel { width: 168px; } .vp-objs { max-height: 88px; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./src/three.module.js"
  }
}
</script>
</head>
<body>
  <div id="left">
    <div id="wrap">
      <canvas id="face"></canvas>

      <!-- 视觉浮层（左下角）：相机实时画面 + 物体识别 + 深度/方位。
           默认常开，点标题栏可折叠成一个小条。内容由 src/vision.js 填充。 -->
      <div id="visionPanel">
        <div class="vp-head" id="visionHead">
          <span class="vp-dot" id="visionDot"></span>
          <span class="vp-title">视觉</span>
          <span class="vp-toggle" id="visionToggle">收起</span>
        </div>
        <div class="vp-body" id="visionBody">
          <img class="vp-video" id="visionVideo" alt="相机画面" />
          <div class="vp-meta" id="visionMeta">初始化…</div>
          <div class="vp-objs" id="visionObjs"></div>
        </div>
      </div>
    </div>
    <div class="sub" style="padding:8px;">全链路流式：LLM（Ark / llama.cpp / Ollama 三选一）+ 工具调用（联网搜索）→ 记忆（滑动窗口 + 摘要 + 用户画像）→ 中央调度（分句 + 表情推送）→ Web Speech TTS → Three.js 3D 数字人 viseme 口型 / 表情</div>
  </div>
  <div id="right">
    <div>
      <h1>数字人对话 · 小柚</h1>
      <div class="sub">状态：<span id="status" class="bad">初始化…</span></div>
    </div>
    <div id="log"></div>
    <!-- 画像冲突确认卡容器：服务端下发 profile_conflict 时在此插入卡片 -->
    <div id="profileCards"></div>
    <div class="expr-row" id="exprTest"></div>
    <div class="row">
      <textarea id="input" placeholder="也可以直接打字，回车发送…"></textarea>
    </div>
    <div class="voice-hint" id="voiceHint"></div>
    <div class="row">
      <button id="send">发送</button>
      <button id="mic">🎤 语音</button>
      <button id="interrupt">打断</button>
      <button id="newchat">新对话</button>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
