# GitHub Actions：轻量静态检查
#
# 目的：每次 push / PR 自动验一下代码能不能编译、密钥有没有被写回代码，
#       避开「在另一台机器 clone 下来才发现是坏的」。
# 边界：只做静态检查——不启动服务、不请求 LLM、不需要任何 API Key，
#       所以不必配置 GitHub Secrets，跑得快也不花额度。
name: checks

on:
  push:
    branches: [master]
  pull_request:
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # Job 1: 语法编译——把 backend/ 下所有 .py 编译一遍
  # ------------------------------------------------------------------
  python-syntax:
    name: Python 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # 跟本机开发环境（Python 3.12）保持一致
          python-version: '3.12'

      - name: compileall backend/
        # -q 只报错；任何语法/缩进/编码错误都会让退出码非 0。
        # 本项目的 .py 含大量中文注释且由脚本生成，这一步正是为了卡住编码事故。
        run: python -m compileall -q backend/ scripts/

      - name: 工具 schema 与函数签名一致性
        # @tool 的 parameters 现在可以从函数签名自动推导（docs § 10.7），
        # 但手写覆盖仍然允许。手写的那些容易与函数参数对不上，
        # 而错误只会在用户真的触发该工具时才报 TypeError，所以在 CI 提前卡住。
        run: python scripts/check_tool_schemas.py

      - name: 记忆模块自检
        # 第 16 章记忆模块：画像合并/冲突人工确认/反思解析/磁盘持久化。
        # 用假 summarizer 跑通反思链路，**不请求 LLM、不需 API Key**；
        # 自检内部把 MEMORY_DATA_DIR 指到临时目录，不会碰真实记忆。
        run: python scripts/check_memory.py

      - name: 表情/动作四处一致性
        # 表情/动作名散落在 head3d.js(EXPR/OVERLAYS)、main.js(EMOTION_SET/ACTION_MAP)、
        # config.py(SYSTEM_PROMPT) 与 text_router.py(简写标记识别) 四处，任一处漏改，
        # 模型给的标记就会被降级丢弃、或（简写标记）被当成正文念出来。
        # 纯静态：只读文本 + 解析 avatar.glb，不请求 LLM、不需密钥。
        run: python scripts/check_expressions.py

      - name: 中央调度标记解析自检
        # 大模型不照 prompt 写 [表情:开心]，实测会写 [歪头:歪头]/[眨眼:眨眼]，
        # 老解析只认 4 个类型词，导致动作不触发、标记还被念出来。
        # 这里把真实日志字符串固化成用例。纯静态，不请求 LLM。
        run: python scripts/check_text_router.py

      - name: 视觉子系统纯逻辑自检
        # 管线本体要相机 + cv2 + YOLO 权重，进不了 CI；这里只测不依赖 cv2 的
        # 纯逻辑：tracker 的 id 稳定性、类名中文化、权重路径解析。
        run: python scripts/check_vision.py

      - name: 关键模块可导入自检
        # 比 compileall 更进一步：真正 import 一次，能捕到循环引用 / 笔误的模块名。
        # 不导入 server.py（它会初始化日志与工具，属于运行时行为）。
        working-directory: backend
        run: |
          pip install -q -r requirements.txt
          python -c "import config, pipeline.text_router, pipeline.turn_policy, tools, vision; print('imports ok')"

  # ------------------------------------------------------------------
  # Job 2: 密钥硬编码扫描
  # ------------------------------------------------------------------
  # 本项目曾把 ARK/TAVILY 密钥写在 config.py 默认值里，为推送 GitHub 做过一次
  # 历史重写（docs 第 14 章）。这个 job 用来防止同样的坑再踩一次。
  secret-scan:
    name: 密钥硬编码扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 扫描跟踪文件
        # 同一个脚本本机也能跑：
        #   python scripts/check_no_hardcoded_secrets.py
        run: python scripts/check_no_hardcoded_secrets.py

  # ------------------------------------------------------------------
  # Job 3: 前端 JS 语法检查
  # ------------------------------------------------------------------
  js-syntax:
    name: 前端 JS 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: node --check 自写模块
        # 只检自己写的模块；three.module.js / GLTFLoader.js / BufferGeometryUtils.js
        # 是直接 vendored 的三方库，不归我们维护，排除。
        # --check 只验语法，不执行（这些文件依赖浏览器 API，在 node 里跑不起来）。
        run: |
          for f in frontend/src/main.js frontend/src/ws.js frontend/src/tts.js frontend/src/viseme.js frontend/src/head3d.js frontend/src/profile_card.js frontend/src/asr.js frontend/src/vision.js; do
            echo "checking $f"
            node --check "$f"
          done
